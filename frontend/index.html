<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Roulette</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Casino Roulette</h1>

    <div class="balance-bar">
        Balance: <span id="saldo">—</span>
    </div>

    <div class="main">

        <!-- Formulario de apuesta -->
        <div class="card">
            <h2>Place a Bet</h2>
            <div class="form-group">
                <label>Number (0–36)</label>
                <input type="number" id="bet-number" min="0" max="36" placeholder="0–36">
            </div>
            <div class="form-group">
                <label>Color</label>
                <select id="bet-color">
                    <option value="red">Red</option>
                    <option value="black">Black</option>
                    <option value="green">Green</option>
                </select>
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="bet-monto" min="1" placeholder="e.g. 100">
            </div>
            <button class="btn btn-gold" onclick="apostar()">Place Bet</button>
            <p id="bet-msg" class="msg"></p>
        </div>

        <!-- Apuestas activas -->
        <div class="card">
            <h2>Active Bets</h2>
            <ul id="apuestas-list"><li class="empty">No bets yet.</li></ul>
            <button class="btn btn-outline" onclick="verApuestas()">Refresh</button>
        </div>

        <!-- Resultado -->
        <div class="card result-card">
            <h2>Result</h2>
            <div class="result-number" id="result-number">—</div>
            <div class="result-color" id="result-color"></div>
            <button class="btn btn-gold" id="spin-btn" onclick="girar()">Spin</button>
            <button class="btn btn-outline" onclick="reiniciar()">Restart</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
